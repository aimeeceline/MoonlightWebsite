name: Moonlight CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Locate solution or project
        id: locate
        shell: bash
        run: |
          set -e
          sln=$(find . -maxdepth 5 -name "*.sln" | head -n 1)
          if [ -n "$sln" ]; then
            echo "target=$sln" >> $GITHUB_OUTPUT
            echo "Found solution: $sln"
            exit 0
          fi

          # fallback: find a csproj (prefer one that looks like the main app)
          csproj=$(find . -maxdepth 6 -name "*.csproj" | head -n 1)
          if [ -n "$csproj" ]; then
            echo "target=$csproj" >> $GITHUB_OUTPUT
            echo "Found project: $csproj"
            exit 0
          fi

          echo "No .sln or .csproj found within expected depth."
          exit 1

      - name: Restore
        run: dotnet restore "${{ steps.locate.outputs.target }}"

      - name: Build
        run: dotnet build "${{ steps.locate.outputs.target }}" --no-restore -c Release

      - name: Test
        run: dotnet test "${{ steps.locate.outputs.target }}" --no-build -c Release --verbosity normal
